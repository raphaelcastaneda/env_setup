# Starship prompt config
# Layout: time  $@  [virtualenv]  directory  git_branch[status]
#         checkmark/X

palette = "catppuccin_mocha"
format = """
$time  [$username@$hostname](teal)   $directory ( $git_branch(\\[$git_status\\]))$fill($git_state )(\\[ $git_metrics\\] )($python )($go )($buf )($container )($docker_context )($jobs )($cmd_duration )
$character"""

[fill]
symbol = " "

[username]
show_always = true
style_user="teal"
aliases = {"raphael" = "$"}
format = "[$user]($style)"

[hostname]
style="teal"
ssh_only = false
aliases = {"Raphael-Castanedas-Work-Laptop" = " "}
format = "[$hostname]($style)"


[time]
disabled = false
format = '[$time]($style)'
style = 'purple'
time_format = '%I:%M %p'

[directory]
truncation_length = 3
style = 'blue'
truncate_to_repo = false

[python]
symbol = " "
format = '[$symbol$version( in $virtualenv)]($style)'
style = 'green bold'
detect_extensions = []
detect_files = []
detect_folders = []

[git_branch]
symbol = " "
format = '[$symbol$branch]($style)'
style = 'lavender'

[git_status]
format = '($ahead_behind$diverged)($staged$modified)(|$stashed)(|$untracked$conflicted)'
use_git_executable = true
ignore_submodules = false
ahead = '[⇡${count}](yellow)'
#ahead = '[󱦲](green)'
behind = '[⇣${count}](peach)'
#behind = '[󱦳](green)'
diverged = '[⇕⇡${ahead_count}⇣${behind_count}](red)'
#diverged = '[󰹹](red)'
staged = '[ $count](yellow)'
modified = '[ $count](red)'
untracked = '[ $count](peach)'
conflicted = '[󰋔 $count](red)'
#up_to_date = '[ ](green)'
stashed = '[ ](sky)'

[git_metrics]
disabled = false

[buf]
format = 'buf $version($style)'

[character]
success_symbol = '[✓](green)'
error_symbol = '[✗](red)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
